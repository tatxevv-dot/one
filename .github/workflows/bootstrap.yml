name: Bootstrap Zone

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: "!contains(github.event.head_commit.message, 'chore: bootstrap Zone')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Zone project files
        run: |
          mkdir -p src/app/api/sync src/app/leagues/'[code]' src/app/teams/'[id]' src/app/matches/'[id]' src/app/players/'[id]' src/lib supabase/migrations

          cat > package.json <<'ZONE_EOF'
          {
            "name": "zone",
            "version": "0.1.0",
            "private": true,
            "scripts": {
              "dev": "next dev",
              "build": "next build",
              "start": "next start"
            },
            "dependencies": {
              "@supabase/supabase-js": "^2.45.4",
              "next": "^15.1.0",
              "react": "^19.0.0",
              "react-dom": "^19.0.0",
              "recharts": "^2.15.0"
            },
            "devDependencies": {
              "@types/node": "^22.10.2",
              "@types/react": "^19.0.2",
              "@types/react-dom": "^19.0.2",
              "autoprefixer": "^10.4.20",
              "postcss": "^8.4.49",
              "tailwindcss": "^3.4.17",
              "typescript": "^5.7.2"
            }
          }
          ZONE_EOF

          cat > next.config.mjs <<'ZONE_EOF'
          const nextConfig = {
            images: {
              remotePatterns: [
                { protocol: "https", hostname: "crests.football-data.org" }
              ]
            }
          };
          export default nextConfig;
          ZONE_EOF

          cat > tsconfig.json <<'ZONE_EOF'
          {
            "compilerOptions": {
              "target": "ES2017",
              "lib": ["dom", "dom.iterable", "esnext"],
              "allowJs": true,
              "skipLibCheck": true,
              "strict": true,
              "noEmit": true,
              "esModuleInterop": true,
              "module": "esnext",
              "moduleResolution": "bundler",
              "resolveJsonModule": true,
              "isolatedModules": true,
              "jsx": "preserve",
              "incremental": true,
              "plugins": [{ "name": "next" }],
              "paths": { "@/*": ["./src/*"] }
            },
            "include": ["next-env.d.ts", "**/*.ts", "**/*.tsx", ".next/types/**/*.ts"],
            "exclude": ["node_modules"]
          }
          ZONE_EOF

          cat > postcss.config.mjs <<'ZONE_EOF'
          export default {
            plugins: {
              tailwindcss: {},
              autoprefixer: {}
            }
          };
          ZONE_EOF

          cat > tailwind.config.ts <<'ZONE_EOF'
          import type { Config } from "tailwindcss";

          const config: Config = {
            content: ["./src/**/*.{js,ts,jsx,tsx,mdx}"],
            theme: {
              extend: {
                colors: {
                  zone: {
                    black: "#000000",
                    surface: "#111113",
                    elevated: "#1C1C1E",
                    border: "#2C2C2E",
                    muted: "#8E8E93",
                    accent: "#0A84FF"
                  }
                }
              }
            },
            plugins: []
          };

          export default config;
          ZONE_EOF

          cat > .env.example <<'ZONE_EOF'
          FOOTBALL_DATA_TOKEN=your-football-data-org-token
          NEXT_PUBLIC_SUPABASE_URL=https://your-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=your-supabase-anon-key
          SUPABASE_SERVICE_ROLE_KEY=your-supabase-service-role-key
          ZONE_EOF

          cat > vercel.json <<'ZONE_EOF'
          {
            "crons": [
              {
                "path": "/api/sync",
                "schedule": "0 3 * * *"
              }
            ]
          }
          ZONE_EOF

          cat > src/lib/supabase.ts <<'ZONE_EOF'
          import { createClient } from "@supabase/supabase-js";

          export function createAdminClient() {
            const url = process.env.NEXT_PUBLIC_SUPABASE_URL;
            const key = process.env.SUPABASE_SERVICE_ROLE_KEY;

            if (!url || !key) throw new Error("Missing Supabase environment variables");

            return createClient(url, key, { auth: { persistSession: false } });
          }
          ZONE_EOF

          cat > src/lib/football-data.ts <<'ZONE_EOF'
          const BASE_URL = "https://api.football-data.org/v4";

          export const COMPETITIONS = [
            { code: "PL", name: "Premier League", country: "England" },
            { code: "PD", name: "La Liga", country: "Spain" },
            { code: "SA", name: "Serie A", country: "Italy" },
            { code: "BL1", name: "Bundesliga", country: "Germany" },
            { code: "FL1", name: "Ligue 1", country: "France" },
            { code: "CL", name: "UEFA Champions League", country: "Europe" }
          ] as const;

          export type CompetitionCode = (typeof COMPETITIONS)[number]["code"];

          async function request<T>(path: string): Promise<T> {
            const token = process.env.FOOTBALL_DATA_TOKEN;
            if (!token) throw new Error("Missing FOOTBALL_DATA_TOKEN");

            const response = await fetch(`${BASE_URL}${path}`, {
              headers: { "X-Auth-Token": token },
              cache: "no-store"
            });

            if (!response.ok) {
              throw new Error(`football-data.org failed: ${response.status}`);
            }

            return response.json();
          }

          export const getStandings = (code: CompetitionCode) => request(`/competitions/${code}/standings`);
          export const getMatches = (code: CompetitionCode) => request(`/competitions/${code}/matches`);
          export const getScorers = (code: CompetitionCode) => request(`/competitions/${code}/scorers`);
          ZONE_EOF

          cat > src/app/globals.css <<'ZONE_EOF'
          @tailwind base;
          @tailwind components;
          @tailwind utilities;

          body {
            background: #000;
            color: #f5f5f7;
          }

          .zone-card {
            @apply rounded-2xl border border-zone-border bg-zone-surface p-5;
          }

          .zone-muted {
            @apply text-sm text-zone-muted;
          }
          ZONE_EOF

          cat > src/app/layout.tsx <<'ZONE_EOF'
          import type { Metadata } from "next";
          import Link from "next/link";
          import "./globals.css";

          export const metadata: Metadata = {
            title: "Zone — Football Analytics",
            description: "Football analytics for Europe's top five leagues and the UEFA Champions League."
          };

          export default function RootLayout({ children }: { children: React.ReactNode }) {
            return (
              <html lang="en">
                <body className="min-h-screen bg-zone-black font-sans">
                  <header className="sticky top-0 border-b border-zone-border bg-black/80 backdrop-blur-xl">
                    <div className="mx-auto flex max-w-7xl items-center justify-between px-5 py-4">
                      <Link href="/" className="text-xl font-semibold">Zone</Link>
                    </div>
                  </header>
                  <main className="mx-auto max-w-7xl px-5 py-8">{children}</main>
                </body>
              </html>
            );
          }
          ZONE_EOF

          cat > src/app/page.tsx <<'ZONE_EOF'
          import Link from "next/link";
          import { COMPETITIONS } from "@/lib/football-data";

          export default function HomePage() {
            return (
              <div className="space-y-10">
                <h1 className="text-4xl font-semibold tracking-tight sm:text-6xl">
                  Understand every match, team and player.
                </h1>
                <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                  {COMPETITIONS.map((competition) => (
                    <Link key={competition.code} href={`/leagues/${competition.code}`} className="zone-card">
                      <p className="text-lg font-semibold">{competition.name}</p>
                      <p className="zone-muted">{competition.country}</p>
                    </Link>
                  ))}
                </div>
              </div>
            );
          }
          ZONE_EOF

          cat > 'src/app/leagues/[code]/page.tsx' <<'ZONE_EOF'
          import { createAdminClient } from "@/lib/supabase";
          import { notFound } from "next/navigation";

          export default async function LeaguePage({ params }: { params: Promise<{ code: string }> }) {
            const { code } = await params;
            const supabase = createAdminClient();
            const { data: standings } = await supabase
              .from("standings")
              .select("position, played, won, drawn, lost, goals_for, goals_against, points, team:teams(name)")
              .eq("competition_id", code.toUpperCase())
              .order("position");

            if (!standings?.length) notFound();

            return (
              <div className="zone-card overflow-x-auto">
                <h1 className="mb-4 text-2xl font-semibold">Standings</h1>
                <table className="w-full text-sm">
                  <tbody>
                    {standings.map((row: any) => (
                      <tr key={row.team.name} className="border-t border-zone-border">
                        <td className="py-3">{row.position}</td>
                        <td className="py-3 font-medium">{row.team.name}</td>
                        <td className="py-3 text-right">{row.played}</td>
                        <td className="py-3 text-right font-semibold">{row.points}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            );
          }
          ZONE_EOF

          cat > 'src/app/teams/[id]/page.tsx' <<'ZONE_EOF'
          import { createAdminClient } from "@/lib/supabase";
          import { notFound } from "next/navigation";

          export default async function TeamPage({ params }: { params: Promise<{ id: string }> }) {
            const { id } = await params;
            const supabase = createAdminClient();
            const { data: team } = await supabase.from("teams").select("*").eq("id", id).maybeSingle();
            if (!team) notFound();

            return (
              <div className="zone-card">
                <h1 className="text-3xl font-semibold">{team.name}</h1>
              </div>
            );
          }
          ZONE_EOF

          cat > 'src/app/matches/[id]/page.tsx' <<'ZONE_EOF'
          import { createAdminClient } from "@/lib/supabase";
          import { notFound } from "next/navigation";

          export default async function MatchPage({ params }: { params: Promise<{ id: string }> }) {
            const { id } = await params;
            const supabase = createAdminClient();
            const { data: match } = await supabase.from("matches").select("*").eq("id", id).maybeSingle();
            if (!match) notFound();

            return (
              <div className="zone-card">
                <h1 className="text-3xl font-semibold">Match</h1>
              </div>
            );
          }
          ZONE_EOF

          cat > 'src/app/players/[id]/page.tsx' <<'ZONE_EOF'
          import { createAdminClient } from "@/lib/supabase";
          import { notFound } from "next/navigation";

          export default async function PlayerPage({ params }: { params: Promise<{ id: string }> }) {
            const { id } = await params;
            const supabase = createAdminClient();
            const { data: player } = await supabase.from("players").select("*").eq("id", id).maybeSingle();
            if (!player) notFound();

            return (
              <div className="zone-card">
                <h1 className="text-3xl font-semibold">{player.name}</h1>
              </div>
            );
          }
          ZONE_EOF

          cat > src/app/api/sync/route.ts <<'ZONE_EOF'
          import { NextResponse } from "next/server";
          import { createAdminClient } from "@/lib/supabase";
          import { COMPETITIONS, getMatches, getStandings, type CompetitionCode } from "@/lib/football-data";

          export const dynamic = "force-dynamic";

          export async function POST() {
            const supabase = createAdminClient();

            for (const competition of COMPETITIONS) {
              const code = competition.code as CompetitionCode;
              const [standings, matches] = await Promise.all([getStandings(code), getMatches(code)]);

              await supabase.from("competitions").upsert({
                id: code,
                name: competition.name,
                code,
                country: competition.country,
                type: code === "CL" ? "cup" : "league"
              });
            }

            return NextResponse.json({ ok: true });
          }
          ZONE_EOF

          cat > supabase/migrations/0001_init.sql <<'ZONE_EOF'
          create table if not exists competitions (
            id text primary key,
            name text not null,
            code text unique,
            country text,
            type text
          );

          create table if not exists seasons (
            id text primary key,
            competition_id text references competitions(id) on delete cascade,
            year int not null,
            start_date date,
            end_date date,
            unique (competition_id, year)
          );

          create table if not exists teams (
            id text primary key,
            name text not null,
            short_name text,
            crest_url text,
            country text
          );

          create table if not exists players (
            id text primary key,
            name text not null,
            team_id text references teams(id) on delete set null,
            position text,
            nationality text,
            birth_date date,
            raw jsonb
          );

          create table if not exists matches (
            id text primary key,
            competition_id text references competitions(id) on delete cascade,
            season_id text references seasons(id) on delete cascade,
            home_team_id text references teams(id) on delete cascade,
            away_team_id text references teams(id) on delete cascade,
            utc_date timestamptz,
            status text,
            matchday int,
            stage text,
            home_goals int,
            away_goals int,
            raw jsonb
          );

          create table if not exists standings (
            id bigserial primary key,
            competition_id text references competitions(id) on delete cascade,
            season_id text references seasons(id) on delete cascade,
            team_id text references teams(id) on delete cascade,
            position int,
            played int,
            won int,
            drawn int,
            lost int,
            goals_for int,
            goals_against int,
            points int,
            form text,
            xg numeric,
            xga numeric,
            xpts numeric,
            updated_at timestamptz default now(),
            unique (competition_id, season_id, team_id)
          );

          create table if not exists team_match_stats (
            id bigserial primary key,
            match_id text references matches(id) on delete cascade,
            team_id text references teams(id) on delete cascade,
            possession numeric,
            shots int,
            shots_on_target int,
            xg numeric,
            xga numeric,
            passes int,
            pass_accuracy numeric,
            corners int,
            fouls int,
            cards int,
            raw jsonb,
            unique (match_id, team_id)
          );

          create table if not exists player_match_stats (
            id bigserial primary key,
            match_id text references matches(id) on delete cascade,
            player_id text references players(id) on delete cascade,
            team_id text references teams(id) on delete cascade,
            minutes int,
            goals int,
            assists int,
            shots int,
            shots_on_target int,
            xg numeric,
            xa numeric,
            passes int,
            pass_accuracy numeric,
            tackles int,
            interceptions int,
            dribbles int,
            rating numeric,
            raw jsonb,
            unique (match_id, player_id)
          );

          create table if not exists match_events (
            id bigserial primary key,
            match_id text references matches(id) on delete cascade,
            minute int,
            type text,
            team_id text references teams(id) on delete cascade,
            player_id text references players(id) on delete set null,
            detail text,
            raw jsonb
          );
          ZONE_EOF

      - name: Commit generated project
        run: |
          git config user.name "Zone Bootstrap"
          git config user.email "actions@github.com"
          git add .
          git diff --cached --quiet || (git commit -m "chore: bootstrap Zone" && git push)
